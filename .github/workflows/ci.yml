name: Enterprise CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test, Security & Build Verification
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          # The same command the README quickstart gives a judge, so CI cannot
          # pass on a dependency set nobody else installs. The bedrock extra is
          # included deliberately: the model path must be importable here too.
          pip install -e ".[dev,bedrock]"
          pip install build

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/ --ignore E501

      - name: Install Browser for the Real User Journey
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute Full Test Suite & Enforce Coverage (>=85%)
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Run Performance & Latency Benchmark
        run: |
          python scripts/measure_request_latency.py --out request_latency_summary.json
          python -m pytest tests/performance/ -v

      - name: Publish Raw Latency Samples
        uses: actions/upload-artifact@v6
        with:
          name: request-latency-${{ github.sha }}
          path: request_latency_summary.json
          if-no-files-found: error

      - name: Build Local Production Artifacts (Wheel & Sdist)
        run: |
          if [ -f "pyproject.toml" ]; then
            python -m build --wheel --sdist --outdir dist
          fi

      - name: Verify Readiness Gate (ci/readiness.py)
        run: |
          python ci/readiness.py
