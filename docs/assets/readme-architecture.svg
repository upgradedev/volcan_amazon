<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">Volcan request architecture</title>
  <desc id="desc">A web companion or MCP client calls Lambda through MCP and REST. Deterministic review produces text, WAV and Braille. Optional Bedrock wording also reaches the output. DynamoDB stores grants and audit state. Alexa+ is simulated by the companion.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8B4328"/></marker></defs>
  <rect width="1120" height="400" rx="16" fill="#F6EFE6"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#231B17">
    <text x="48" y="40" font-size="22" font-weight="700">Findings first. Model wording is optional.</text>
    <g fill="none" stroke="#8B4328" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M258 204H316"/><path d="M526 204H592"/><path d="M802 204H866"/>
      <path d="M421 248V298"/>
    </g>
    <g fill="none" stroke="#8B4328" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)">
      <path d="M421 160V97H592"/><path d="M802 97H972V160"/>
    </g>
    <rect x="48" y="160" width="210" height="88" rx="12" fill="#FFFDF9" stroke="#D0B9A7" stroke-width="2"/>
    <text x="153" y="191" text-anchor="middle" font-size="19" font-weight="700">Web companion</text>
    <text x="153" y="215" text-anchor="middle" font-size="18">or MCP client</text>
    <text x="153" y="237" text-anchor="middle" font-size="14" fill="#72533F">Alexa+ front end simulated</text>
    <rect x="316" y="160" width="210" height="88" rx="12" fill="#C54B1C"/>
    <text x="421" y="197" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Lambda</text>
    <text x="421" y="226" text-anchor="middle" font-size="18" fill="#FFFFFF">MCP + REST</text>
    <rect x="592" y="160" width="210" height="88" rx="12" fill="#FFFDF9" stroke="#D0B9A7" stroke-width="2"/>
    <text x="697" y="198" text-anchor="middle" font-size="20" font-weight="700">Deterministic</text>
    <text x="697" y="225" text-anchor="middle" font-size="19">review</text>
    <rect x="866" y="160" width="212" height="88" rx="12" fill="#231B17"/>
    <text x="972" y="197" text-anchor="middle" font-size="22" font-weight="700" fill="#F6EFE6">Text · WAV</text>
    <text x="972" y="226" text-anchor="middle" font-size="21" fill="#FF9D3D">Braille</text>
    <rect x="592" y="65" width="210" height="64" rx="12" fill="#FFF6E6" stroke="#C54B1C" stroke-width="2"/>
    <text x="697" y="92" text-anchor="middle" font-size="19" font-weight="700">Optional Bedrock</text>
    <text x="697" y="116" text-anchor="middle" font-size="17">wording only</text>
    <rect x="316" y="298" width="270" height="68" rx="12" fill="#FFFDF9" stroke="#D0B9A7" stroke-width="2"/>
    <text x="451" y="328" text-anchor="middle" font-size="21" font-weight="700">DynamoDB</text>
    <text x="451" y="352" text-anchor="middle" font-size="18">grants / audit state</text>
  </g>
</svg>
