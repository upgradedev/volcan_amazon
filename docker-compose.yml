version: "3.8"

services:
  volcan-mcp-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      # Origins the MCP endpoint accepts from a browser. Listing them is
      # deliberate: '*' would disable the DNS-rebinding check the spec asks for.
      - VOLCAN_ALLOWED_ORIGINS=http://127.0.0.1:8000,http://localhost:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
