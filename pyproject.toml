[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volcan_amazon"
version = "0.1.0"
description = "Volcan lets blind and low-vision software developers review autonomous coding agents by ear and by touch instead of by reading a diff."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
#: Only the Amazon Bedrock synthesis path needs this. Everything else, the MCP
#: server included, runs without it and says so when the path is unavailable.
#: Pinned to the version the 2026-10-06 model measurements used (see
#: DEFAULT_MODEL_ID in src/infrastructure/bedrock_adapter.py). The Lambda
#: package is built outside this repository, so the pin binds only builds
#: that resolve from this file.
bedrock = [
    "anthropic[bedrock]==1.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.55.0",
    "ruff>=0.2.0",
    #: Validates structuredContent against each published outputSchema in the
    #: JSON Schema 2020-12 dialect MCP defaults to.
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
