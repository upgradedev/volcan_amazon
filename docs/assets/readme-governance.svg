<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">Volcan governed review flow</title>
  <desc id="desc">Stage an exact review to receive a signed grant with a lease. Domain checks refuse self-approval by an agent principal. A declared human principal must pass hash, nonce and head checks. The hosted result is a dry run and sealed audit record; no GitHub review is sent. These role checks do not prove an independent human identity.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8B4328"/></marker></defs>
  <rect width="1120" height="350" rx="16" fill="#F6EFE6"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#231B17">
    <text x="36" y="39" font-size="22" font-weight="700">Bound to the review. Dry-run by default.</text>
    <g fill="none" stroke="#8B4328" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M181 203H220"/><path d="M380 203H420"/>
      <path d="M590 203H650"/><path d="M860 203H902"/>
      <path d="M505 163V92H650"/>
    </g>
    <text x="548" y="78" font-size="16" fill="#72533F">Agent</text>
    <text x="598" y="190" font-size="15" fill="#72533F">Human</text>
    <rect x="36" y="163" width="145" height="80" rx="12" fill="#FFFDF9" stroke="#D0B9A7" stroke-width="2"/>
    <text x="108" y="196" text-anchor="middle" font-size="20" font-weight="700">Stage exact</text>
    <text x="108" y="222" text-anchor="middle" font-size="19">review</text>
    <rect x="220" y="163" width="160" height="80" rx="12" fill="#C54B1C"/>
    <text x="300" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Signed grant</text>
    <text x="300" y="223" text-anchor="middle" font-size="18" fill="#FFFFFF">hash · lease</text>
    <rect x="420" y="163" width="170" height="80" rx="12" fill="#FFFDF9" stroke="#C54B1C" stroke-width="2"/>
    <text x="505" y="197" text-anchor="middle" font-size="20" font-weight="700">Declared</text>
    <text x="505" y="223" text-anchor="middle" font-size="19">principal?</text>
    <rect x="650" y="55" width="210" height="74" rx="12" fill="#FFE4DB" stroke="#C54B1C" stroke-width="2"/>
    <text x="755" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#7B2712">Refuse</text>
    <text x="755" y="112" text-anchor="middle" font-size="18" fill="#7B2712">self-approval</text>
    <rect x="650" y="163" width="210" height="80" rx="12" fill="#FFFDF9" stroke="#2E7D54" stroke-width="2"/>
    <text x="755" y="195" text-anchor="middle" font-size="20" font-weight="700">Check hash,</text>
    <text x="755" y="222" text-anchor="middle" font-size="18">nonce and head</text>
    <rect x="902" y="163" width="182" height="80" rx="12" fill="#17452B"/>
    <text x="993" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Dry run</text>
    <text x="993" y="222" text-anchor="middle" font-size="16" fill="#FFFFFF">Sealed audit record</text>
    <text x="36" y="292" font-size="18" fill="#44372E">Domain role checks do not prove an independent human identity.</text>
    <text x="36" y="320" font-size="18" fill="#44372E">The hosted path sends no GitHub review.</text>
  </g>
</svg>
